
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: EcoGuard Backend APIs - Member 3

Parameters:
  ExistingTableName:
    Type: String
    Default: ecoguard-pipeline-FilesTable-7T9WJ72MHXFO

  ExistingBucketName:
    Type: String
    Default: ecoguard-media-853611856490

  UserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:ap-southeast-2:853611856490:userpool/ap-southeast-2_WI1ngaH1k

  FrontendOrigin:
    Type: String
    Default: "http://localhost:5173"

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Environment:
      Variables:
        TABLE: !Ref ExistingTableName
        BUCKET: !Ref ExistingBucketName

Resources:
  NotificationsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: ecoguard-notifications-dlq
      MessageRetentionPeriod: 1209600
  AnimalNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ecoguard-animal-notifications
# Existing API Gateway configuration
  BackendApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin: !Sub "'${FrontendOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref UserPoolArn

  # Existing Search by Tags Lambda
  SearchTagsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Search completed media by species and minimum counts
      CodeUri: search_tags/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingTableName}"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${ExistingBucketName}/uploads/*"
                - !Sub "arn:aws:s3:::${ExistingBucketName}/thumbnails/*"
      Events:
        SearchTags:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /media/search/tags
            Method: post

   # New Search by Thumbnail Lambda
  SearchThumbnailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Find original image using thumbnail URL
      CodeUri: search_thumbnail/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingTableName}"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${ExistingBucketName}/uploads/*"
      Events:
        SearchThumbnail:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /media/search/thumbnail
            Method: post
  
  SearchTempTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: image_key
          AttributeType: S
      KeySchema:
        - AttributeName: image_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  
  NotificationSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
 
  SearchUploadInitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Generate temporary image upload URLs for search
      CodeUri: search_upload_init/
      Handler: handler.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          TEMP_TABLE: !Ref SearchTempTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${ExistingBucketName}/search-temp/*"
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt SearchTempTable.Arn
      Events:
        SearchUploadInit:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /media/search/upload/init
            Method: post
  
  SearchUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Search completed media using an uploaded image
      CodeUri: search_upload/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          TEMP_TABLE: !Ref SearchTempTable
          DETECT_FUNCTION: arn:aws:lambda:ap-southeast-2:853611856490:function:ecoguard-detect
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingTableName}"
            - Effect: Allow
              Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
              Resource: !GetAtt SearchTempTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::${ExistingBucketName}/search-temp/*"
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub "arn:aws:s3:::${ExistingBucketName}/uploads/*"
                - !Sub "arn:aws:s3:::${ExistingBucketName}/thumbnails/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: arn:aws:lambda:ap-southeast-2:853611856490:function:ecoguard-detect
      Events:
        SearchUpload:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /media/search/upload
            Method: post

  NotificationsSubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Manage animal notification email subscriptions
      CodeUri: notifications_subscribe/
      Handler: handler.lambda_handler
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AnimalNotificationsTopic
          SUBSCRIPTIONS_TABLE: !Ref NotificationSubscriptionsTable
          FRONTEND_ORIGIN: !Ref FrontendOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt NotificationSubscriptionsTable.Arn
            - Effect: Allow
              Action:
                - sns:Subscribe
                - sns:ListSubscriptionsByTopic
                - sns:GetSubscriptionAttributes
              Resource: !Ref AnimalNotificationsTopic
      Events:
        Subscribe:
          Type: Api
          Properties:
            RestApiId: !Ref BackendApi
            Path: /notifications/subscribe
            Method: post

  NotificationsStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Events:
        FilesTableStream:
          Type: DynamoDB
          Properties:
            Stream: arn:aws:dynamodb:ap-southeast-2:853611856490:table/ecoguard-pipeline-FilesTable-7T9WJ72MHXFO/stream/2026-10-18T08:54:50.113
            StartingPosition: LATEST
            BatchSize: 1
            Enabled: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 3600
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt NotificationsDeadLetterQueue.Arn
      CodeUri: notifications_stream/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref AnimalNotificationsTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AnimalNotificationsTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt NotificationsDeadLetterQueue.Arn

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource:
                - arn:aws:dynamodb:ap-southeast-2:853611856490:table/ecoguard-pipeline-FilesTable-7T9WJ72MHXFO/stream/*

Outputs:
  # Existing output
  BackendApiUrl:
    Description: URL for Member 3 backend APIs
    Value: !Sub "https://${BackendApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  TableName:
    Value: !Ref ExistingTableName

  BucketName:
    Value: !Ref ExistingBucketName
